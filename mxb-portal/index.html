<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX Bikes Custom Portal</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans tracking-wide">

    <!-- Navigation Hub -->
    <header class="bg-black p-5 border-b-2 border-yellow-500 shadow-md shadow-yellow-500/10">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🏁</span>
                <h1 class="text-2xl font-black text-yellow-500 tracking-tighter">MXB ENGINE PORTAL</h1>
            </div>
            <span class="bg-gray-800 px-3 py-1 rounded text-xs font-mono text-gray-400 border border-gray-700">Status: Connection Active</span>
        </div>
    </header>

    <!-- Main Live Dashboard -->
    <main class="container mx-auto mt-10 px-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Live Server Component -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-extrabold text-yellow-400 flex items-center gap-2">🌐 Dedicated Servers</h2>
                    <span class="animate-pulse h-2 w-2 rounded-full bg-green-400"></span>
                </div>
                <div id="server-container" class="space-y-3">
                    <p class="text-sm text-gray-500">Querying active networks...</p>
                </div>
            </div>

            <!-- Global Leaderboard Component -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-xl">
                <h2 class="text-xl font-extrabold text-yellow-400 mb-6">🏆 Live Leaderboard</h2>
                <div class="overflow-hidden rounded-lg border border-gray-700">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-700 text-xs text-gray-400 uppercase">
                                <th class="p-3">Pos</th>
                                <th class="p-3">Rider</th>
                                <th class="p-3 text-right">Lap Time</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-container" class="divide-y divide-gray-700 text-sm">
                            <!-- Injected dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Rider Dev Center / Submit Panel -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-xl">
                <h2 class="text-xl font-extrabold text-yellow-400 mb-4">🚀 Track Local Lap</h2>
                <p class="text-xs text-gray-400 mb-4">Simulate a backend data push from an MX Bikes server telemetry plugin.</p>
                
                <form id="lapForm" class="space-y-3 text-sm">
                    <div>
                        <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Rider Name</label>
                        <input type="text" id="riderName" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:outline-none focus:border-yellow-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Lap Time (MM:SS.ms)</label>
                        <input type="text" id="lapTime" placeholder="1:45.220" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:outline-none focus:border-yellow-500">
                    </div>
                    <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2 rounded transition">Transmit to Web Portal</button>
                </form>
            </div>

        </div>
    </main>

    <footer class="text-center text-xs text-gray-600 mt-20 pb-5">
        Custom MX Bikes Web Interface. Powered by community telemetry data.
    </footer>

    <script>
        // Fetch background metrics dynamically 
        async function refreshPortalData() {
            try {
                // Fetch and parse Server Data
                const serverRes = await fetch('/api/servers');
                const servers = await serverRes.json();
                const serverDiv = document.getElementById('server-container');
                serverDiv.innerHTML = '';
                
                servers.forEach(srv => {
                    serverDiv.innerHTML += `
                        <div class="p-3 bg-gray-900/50 hover:bg-gray-900 rounded border border-gray-700 flex justify-between items-center transition">
                            <div>
                                <p class="font-bold text-gray-200 text-sm">${srv.name}</p>
                                <p class="text-xs text-gray-500">📍 ${srv.track} | Ping: ${srv.ping}ms</p>
                            </div>
                            <span class="bg-yellow-500/10 text-yellow-400 text-xs px-2.5 py-1 rounded-full font-mono font-bold border border-yellow-500/20">${srv.players}/${srv.maxPlayers}</span>
                        </div>`;
                });

                // Fetch and parse Leaderboard Data
                const leaderboardRes = await fetch('/api/leaderboard');
                const leaderboard = await leaderboardRes.json();
                const lbContainer = document.getElementById('leaderboard-container');
                lbContainer.innerHTML = '';

                leaderboard.forEach(row => {
                    lbContainer.innerHTML += `
                        <tr class="hover:bg-gray-700/30 transition">
                            <td class="p-3 font-mono text-gray-500">#${row.position}</td>
                            <td class="p-3 font-medium">${row.name}</td>
                            <td class="p-3 text-right font-mono text-yellow-400 font-bold">${row.time}</td>
                        </tr>`;
                });

            } catch (err) {
                console.error("Portal fetch sync failed:", err);
            }
        }

        // Handle client data submission simulation
        document.getElementById('lapForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('riderName').value;
            const time = document.getElementById('lapTime').value;

            await fetch('/api/laptime', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, track: "Unadilla 2026", time })
            });

            document.getElementById('riderName').value = '';
            document.getElementById('lapTime').value = '';
            refreshPortalData();
        });

        // Initialize portal engine loop
        refreshPortalData();
        setInterval(refreshPortalData, 10000); // Auto-re-syncs client side every 10 seconds
    </script>
</body>
</html>
